# Experiment 1 — path supervision and temporal composition (paper Sec. 5.2, App. D.2).
# Objective: L_end + 5 L_geo^dir + 1[path] L_path + 0.5 1[comp] L_comp + 0.02 L_rep
kind: forecast
name: exp1
out_dir: results/exp1

geo_supervision: direct          # geometry loss only on the direct terminal prediction
decoder_cov_stabilize: false
partition_seed_offset: 100000

train_horizons: [1, 2, 4, 8]
unseen_horizons: [3, 6]          # never trained; interpolation test
train_partitions:
  1: [[1]]
  2: [[1, 1]]
  4: [[2, 2], [1, 1, 2]]
  8: [[4, 4], [2, 2, 4]]
primary_partitions:              # validation + main rollout route per horizon
  1: [1]
  2: [1, 1]
  3: [1, 2]
  4: [2, 2]
  6: [2, 4]
  8: [4, 4]
heldout_seen_segment_partitions: # new decompositions, only trained segment lengths
  4: [[2, 1, 1], [1, 2, 1]]
  8: [[4, 2, 2], [2, 4, 2], [2, 2, 2, 2]]
unseen_segment_partitions:       # contain segment lengths 3 / 5, never trained
  4: [[1, 3], [3, 1]]
  8: [[3, 5], [5, 3]]

seeds: [0, 1, 2]
variants:
  Endpoint: {}
  Endpoint + Path: {path: true}
  Endpoint + Composition: {comp: true}
  Endpoint + Path + Composition: {path: true, comp: true}
